<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>9Remote Terminal</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            terminal: { bg: '#0a0a0a', text: '#00ff41' }
          }
        }
      }
    }
  </script>
  
  <!-- xterm.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  
  <!-- Socket.IO -->
  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
  <div id="app">
    <!-- Login Screen -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
      <div class="max-w-md w-full space-y-8">
        <div class="text-center">
          <h1 class="text-4xl font-bold text-green-400 mb-2">🖥️ 9Remote</h1>
          <p class="text-gray-400">Remote terminal access</p>
        </div>
        
        <div class="bg-gray-800 rounded-lg shadow-xl p-8 space-y-6">
          <div id="token-auth" class="hidden">
            <p class="text-sm text-gray-400 mb-4">Authenticating with token...</p>
            <div class="flex justify-center">
              <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-green-500"></div>
            </div>
          </div>
          
          <div id="manual-auth">
            <div>
              <label class="block text-sm font-medium text-gray-300 mb-2">API Key</label>
              <input 
                type="text" 
                id="apiKey"
                placeholder="sk-xxxxxxxx-xxxxxx-xxxxxxxx"
                class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500"
              />
            </div>
            
            <button id="connectBtn" class="w-full py-3 bg-green-500 hover:bg-green-600 text-gray-900 font-semibold rounded-lg transition disabled:bg-gray-600 disabled:cursor-not-allowed">
              Connect
            </button>
          </div>
          
          <div id="status" class="text-sm text-gray-400 text-center"></div>
        </div>
      </div>
    </div>
    
    <!-- Terminal Screen -->
    <div id="terminal-screen" class="hidden h-screen flex flex-col overflow-hidden bg-slate-900">
      <!-- Header -->
      <header class="bg-slate-800 border-b border-slate-700 px-2 sm:px-6 py-3 sm:py-4 flex-shrink-0">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2 sm:space-x-3">
            <div id="connection-status" class="flex items-center space-x-2">
              <span class="w-2 h-2 rounded-full bg-green-500"></span>
            </div>
            <h1 class="text-white text-sm sm:text-base font-semibold">9Remote Terminal</h1>
          </div>
          <div class="flex items-center space-x-2 sm:space-x-4">
            <button id="disconnectBtn" class="px-2 sm:px-3 py-1 sm:py-1.5 bg-red-500 hover:bg-red-600 text-white text-xs sm:text-sm font-medium rounded transition">
              Disconnect
            </button>
          </div>
        </div>
      </header>
      
      <!-- Terminal Container -->
      <main class="flex-1 overflow-hidden p-2 sm:p-4 bg-slate-900">
        <div id="terminal" class="w-full h-full rounded-lg overflow-hidden shadow-2xl"></div>
      </main>
    </div>
  </div>
  
  <!-- App JS -->
  <script type="module" src="/js/terminal.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
