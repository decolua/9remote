[package]
name = "nine-remote-desktop"
version = "2.3.6"
description = "9Remote Desktop App"
authors = ["9Remote"]
edition = "2021"

[lib]
name = "nine_remote_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nine-remote-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
url = "2"
# Node runtime download: .tar.gz over .tar.xz so gunzip stays pure Rust (no liblzma)
flate2 = "1"
tar = "0.4"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
