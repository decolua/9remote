name = "9remote-worker"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "9remote.cc/*"
zone_name = "9remote.cc"

[vars]
CLOUDFLARE_ACCOUNT_ID = "4499702710a2818880232d356243a422"
TURN_KEY_ID = "7e896708cbd77c30e5d1211f48ea859f"
BUILD_VERSION = "2.4.0"
BUILD_TIME = "2026-03-12T00:00:00.000Z"
ALLOWED_ORIGINS = "https://9remote.cc,https://dev.9remote.cc"
# OTA: public R2 base (assets are served from a subdomain, not through Worker)
R2_PUBLIC_BASE = "https://r2.9remote.cc"
OTA_DEFAULT_CHANNEL = "production"

# Secrets managed via web/.dev.vars + `npm run secrets:sync`
#   CLOUDFLARE_API_KEY, CLOUDFLARE_EMAIL
#   TURN_KEY_SECRET
#   API_KEY_SECRET, ADMIN_JWT_SECRET, TOKEN_SECRET, CRON_SECRET
#   OTA_SIGNING_PRIVATE_KEY, OTA_SIGNING_KEY_ID, OTA_PUBLISH_TOKEN
#   IAP Apple: APPLE_KEY_ID, APPLE_ISSUER_ID, APPLE_PRIVATE_KEY, APPLE_BUNDLE_ID
#   IAP Google: GOOGLE_SERVICE_ACCOUNT_JSON, GOOGLE_PACKAGE_NAME

# OTA manifest cache (signed payload) — create then set id:
#   wrangler kv:namespace create OTA_KV
[[kv_namespaces]]
binding = "OTA_KV"
id = "81ee3ab504b542ba90e8179f95f5cbf0"

[[d1_databases]]
binding = "DB"
database_name = "9remote"
database_id = "df1dac06-213c-444d-8751-b7918e044356"

# Signaling DO — WebSocket Hibernation relay for WebRTC signaling fallback.
# Injected into .open-next/worker.js by scripts/injectSignalingDO.mjs at build time.
[[durable_objects.bindings]]
name = "SIGNALING_DO"
class_name = "SignalingDO"

[[migrations]]
tag = "v1-signaling"
new_sqlite_classes = ["SignalingDO"]

[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true

[assets]
directory = ".open-next/assets"

[env.dev]
name = "9remote-worker-dev"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[env.dev.routes]]
pattern = "dev.9remote.cc/*"
zone_name = "9remote.cc"

[env.dev.vars]
CLOUDFLARE_ACCOUNT_ID = "4499702710a2818880232d356243a422"
TURN_KEY_ID = "7e896708cbd77c30e5d1211f48ea859f"
BUILD_VERSION = "2.4.0"
BUILD_TIME = "2026-03-12T00:00:00.000Z"
ALLOWED_ORIGINS = "https://dev.9remote.cc,http://localhost:3000"
R2_PUBLIC_BASE = "https://r2.9remote.cc"
OTA_DEFAULT_CHANNEL = "preview"

[[env.dev.kv_namespaces]]
binding = "OTA_KV"
id = "a36a2b65355945448c246928f4b3f517"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "9remote"
database_id = "df1dac06-213c-444d-8751-b7918e044356"

[[env.dev.durable_objects.bindings]]
name = "SIGNALING_DO"
class_name = "SignalingDO"

[env.dev.triggers]
crons = ["0 * * * *"]

[env.dev.assets]
directory = ".open-next/assets"
