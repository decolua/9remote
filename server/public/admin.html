<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARemote 管理</title><link rel="stylesheet" href="/admin.css"><main><h1>ARemote 管理</h1><p id="status" role="status"></p><form id="login"><label>管理员密码 <input name="password" type="password" minlength="12" required autocomplete="current-password"></label><button>登录</button></form><section id="panel" hidden><button id="refresh">刷新</button> <button id="logout">退出</button><p id="metrics"></p><h2>设备</h2><div id="devices"></div><h2>配对设备</h2><form id="pair"><select name="role"><option value="host">Host</option><option value="client">Client</option></select><button>生成一次性配对码</button></form><p>配对码有效期 10 分钟；Client 注册后需在下方授权。</p><output id="code"></output><h2>访问授权</h2><form id="grant"><label>Client <select name="clientId" id="clients"></select></label><label>Host <select name="hostId" id="hosts"></select></label><button>授权</button></form><div id="grants"></div><h2>修改管理员密码</h2><form id="password"><input name="currentPassword" type="password" placeholder="当前密码" required autocomplete="current-password"><input name="password" type="password" placeholder="新密码（至少 12 字符）" minlength="12" maxlength="1024" required autocomplete="new-password"><button>修改并退出</button></form><h2>活跃会话</h2><pre id="sessions"></pre><h2>连接日志</h2><pre id="logs"></pre></section></main><script src="/admin.js"></script></html>
