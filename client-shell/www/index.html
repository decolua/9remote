<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARemote</title><style>:root{color-scheme:dark;font:18px system-ui;background:#111827;color:#f3f4f6}main{max-width:480px;margin:12vh auto;padding:24px}input,button{box-sizing:border-box;width:100%;font:inherit;padding:14px;margin:12px 0;border-radius:8px;border:1px solid #4b5563;background:#1f2937;color:inherit}button{cursor:pointer;background:#2563eb}#error{color:#fca5a5}</style><main><h1>ARemote</h1><p>输入自托管 Server 的 HTTPS 地址和端口。</p><form id="connect"><label>Server 地址<input id="server" type="url" placeholder="https://remote.example.com" required></label><label>端口（可选）<input id="port" type="number" min="1" max="65535"></label><button>连接 Server</button></form><p id="error" role="alert"></p></main><script src="launcher.js"></script></html>
