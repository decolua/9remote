name: ARemote Phase 1 validation
on:
  workflow_dispatch:
  push:
    branches: [phase1/self-hosted-relay]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix server --workspaces=false
      - run: npm test --prefix server --workspaces=false
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - run: npx --yes @tauri-apps/cli@2.12.4 build
        working-directory: client-shell
      - uses: actions/upload-artifact@v4
        with:
          name: ARemote-Windows
          path: client-shell/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon assembleDebug
        working-directory: client-shell/android
      - uses: actions/upload-artifact@v4
        with:
          name: ARemote-Android-debug
          path: client-shell/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
