<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>9Remote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    // Apply saved theme before render to prevent flash (same key as agent UI)
    document.documentElement.setAttribute("data-theme", localStorage.getItem("9remote-theme") || "dark");
  </script>
  <style>
    /* Design tokens — synced with agent/ui/src/index.css */
    :root {
      --radius-brand: 12px;
      --radius-brand-lg: 18px;
    }

    :root[data-theme="light"] {
      --brand-500: #E85A2C;
      --brand-rgb: 232, 90, 44;
      --brand-tint: rgba(232, 90, 44, 0.12);
      --bg-main: #FCFBF9;
      --bg-alt: #F3F1ED;
      --bg-body: #FCFBF9;
      --border: rgba(20, 30, 60, 0.10);
      --text-main: #0C1230;
      --text-muted: #5A648A;
      --glass-bg: rgba(255, 255, 255, 0.74);
      --glass-border: rgba(20, 30, 60, 0.10);
      --grid-opacity: 0.08;
      --danger: #DC2626;
      --danger-rgb: 220, 38, 38;
      --shadow-elev:
        inset 0 1px 0 0 rgba(255, 255, 255, 0.9),
        0 24px 50px -20px rgba(60, 70, 120, 0.35);
    }

    :root[data-theme="dark"] {
      --brand-500: #FF6A3D;
      --brand-rgb: 255, 106, 61;
      --brand-tint: rgba(255, 106, 61, 0.12);
      --bg-main: #1a1a1a;
      --bg-alt: #242424;
      --bg-body: #1a1a1a;
      --border: rgba(255, 255, 255, 0.08);
      --text-main: #EAF0FF;
      --text-muted: #8B98B8;
      --glass-bg: rgba(56, 56, 61, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
      --grid-opacity: 0.04;
      --danger: #FF5252;
      --danger-rgb: 255, 82, 82;
      --shadow-elev:
        inset 0 1px 0 0 rgba(255, 255, 255, 0.06),
        0 24px 60px -18px rgba(3, 6, 16, 0.9);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; width: 100%; overflow: hidden; }

    body {
      font-family: "Sora", system-ui, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Background layers — same stack as MainScreen */
    .dot-grid-bg {
      position: fixed;
      inset: 0;
      z-index: -4;
      pointer-events: none;
      background: linear-gradient(160deg, var(--bg-alt), var(--bg-main) 55%, var(--bg-body));
    }

    .landing-grid {
      position: fixed;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      background-image:
        linear-gradient(to right, var(--brand-500) 1px, transparent 1px),
        linear-gradient(to bottom, var(--brand-500) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: var(--grid-opacity);
    }

    /* card-elev — agent UI elevated card */
    .card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow: var(--shadow-elev);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      padding: 36px 32px;
      width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .logo { width: 48px; height: 48px; border-radius: var(--radius-brand); flex-shrink: 0; }

    .brand-text {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    /* Step indicator — mirrors StepProgress active dot spinner */
    .step-dot {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      background: var(--brand-tint);
      border: 1.5px solid var(--brand-500);
    }

    .step-dot i {
      width: 4px;
      height: 4px;
      border-radius: 999px;
      background: var(--brand-500);
      animation: dot-bounce 1s ease-in-out infinite;
    }

    @keyframes dot-bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%           { transform: scale(1);   opacity: 1; }
    }

    #status {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      text-align: center;
      min-height: 20px;
      line-height: 1.5;
      word-break: break-word;
      /* setup_error carries the host log tail — render and scroll it */
      white-space: pre-line;
      max-height: 200px;
      overflow-y: auto;
      transition: opacity 0.3s;
    }

    .stage.failed #status {
      font-size: 11px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      text-align: left;
      user-select: text;
    }

    .progress-bar {
      width: 100%;
      height: 3px;
      background: var(--brand-tint);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--brand-500);
      border-radius: 99px;
      animation: indeterminate 1.6s ease-in-out infinite;
    }

    @keyframes indeterminate {
      0%   { margin-left: 0%;   width: 30%; }
      50%  { margin-left: 50%;  width: 40%; }
      100% { margin-left: 100%; width: 10%; }
    }

    /* Failed state — error tint, no motion */
    .stage.failed .step-dot {
      background: rgba(var(--danger-rgb), 0.12);
      border-color: var(--danger);
    }
    .stage.failed .step-dot i { animation: none; background: var(--danger); opacity: 1; transform: none; }
    .stage.failed .progress-bar { display: none; }
    .stage.failed #status { color: var(--danger); }

    @media (prefers-reduced-motion: reduce) {
      .step-dot i, .progress-fill { animation: none; }
    }
  </style>
</head>
<body>
  <div class="dot-grid-bg" aria-hidden="true"></div>
  <div class="landing-grid" aria-hidden="true"></div>

  <div class="card">
    <!-- favicon.svg markup, inlined -->
    <svg class="logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <rect width="24" height="24" rx="6" fill="#FF570A"/>
      <polyline points="5 18 10.5 12 5 6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="13" y1="18" x2="19" y2="18" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </svg>

    <span class="brand-text">9Remote</span>

    <div class="stage" id="stage">
      <div class="step-dot"><i></i><i style="animation-delay:0.18s"></i><i style="animation-delay:0.36s"></i></div>
      <div id="status">Initializing...</div>
      <div class="progress-bar"><div class="progress-fill"></div></div>
    </div>
  </div>

  <script>
    // The Rust shell polls the agent and navigates this window once it is healthy —
    // this page only reflects setup state (it cannot poll: cross-origin is blocked).
    const status = document.getElementById("status");
    const stage = document.getElementById("stage");

    let failed = false;

    function setStatus(msg) {
      if (failed) return;
      status.style.opacity = "0";
      setTimeout(() => {
        status.textContent = msg;
        status.style.opacity = "1";
      }, 150);
    }

    function setError(msg) {
      failed = true;
      stage.classList.add("failed");
      status.style.opacity = "1";
      status.textContent = msg;
    }

    async function initTauri() {
      try {
        if (!window.__TAURI__?.event?.listen) return;
        await window.__TAURI__.event.listen("setup_progress", (e) => setStatus(e.payload));
        await window.__TAURI__.event.listen("setup_ready", () => setStatus("Ready! Loading..."));
        await window.__TAURI__.event.listen("setup_error", (e) => setError(e.payload));
      } catch { /* ignore */ }
    }

    initTauri();
  </script>
</body>
</html>
